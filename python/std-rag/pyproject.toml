[project]
name = "std-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "std-llm-client",
    "std-embeddings",
    "std-vector-store",
    "rank-bm25>=0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/std_rag"]
